[package]
name = "second-brain-black-hole"
version = "0.2.3"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
dirs = "5"
serialport = { version = "4.10", default-features = false }
tauri-plugin-updater = "2"
