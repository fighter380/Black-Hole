name: Black Hole Rolling

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: black-hole-rolling
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lire le dernier build publié
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST_BASE: ${{ github.event.before }}
        run: |
          $tag = 'rolling'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $release = Invoke-RestMethod "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" -Headers $headers -SkipHttpErrorCheck -StatusCodeVariable status
          if ($status -notin 200, 404) { throw "GitHub Releases a renvoyé $status." }

          $base = $env:FIRST_BASE
          $versions = @()
          if ($status -eq 200) {
            if ($release.immutable -or $release.draft) { throw "La release rolling doit être publique et modifiable." }
            foreach ($asset in $release.assets) {
              if ($asset.name -match '^Black-Hole_(\d+\.\d+\.\d+)_x64-setup\.exe$') {
                $versions += [version]$Matches[1]
              }
            }
            if ($release.assets.name -contains 'latest.json') {
              $previousPath = Join-Path $env:RUNNER_TEMP 'black-hole-previous.json'
              gh release download $tag --pattern latest.json --output $previousPath --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -ne 0) { throw "Impossible de lire le manifeste publié." }
              $previous = Get-Content -Raw -Encoding UTF8 -LiteralPath $previousPath | ConvertFrom-Json
              if ($previous.commit -notmatch '^[0-9a-f]{40}$') { throw "SHA publié invalide." }
              $base = $previous.commit
              $versions += [version]$previous.version
            }
          }
          $highest = $versions | Sort-Object -Descending | Select-Object -First 1
          "base=$base" >> $env:GITHUB_OUTPUT
          "highest=$highest" >> $env:GITHUB_OUTPUT
          "already_published=$([string]($previous.commit -eq $env:GITHUB_SHA))" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        if: steps.previous.outputs.already_published != 'True'
        with:
          node-version: 22
          cache: npm

      - name: Construire l’éditeur
        if: steps.previous.outputs.already_published != 'True'
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:editor

      - uses: dtolnay/rust-toolchain@stable
        if: steps.previous.outputs.already_published != 'True'

      - name: Mettre en cache les dépendances Rust
        if: steps.previous.outputs.already_published != 'True'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          cache-bin: 'false'

      - name: Installer la CLI Tauri
        if: steps.previous.outputs.already_published != 'True'
        run: npm exec --yes --package=@tauri-apps/cli@2.12.6 -- tauri --version

      - name: Signer l’installateur et produire les nouveautés
        id: build
        if: steps.previous.outputs.already_published != 'True'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BASE_COMMIT: ${{ steps.previous.outputs.base }}
          PUBLISHED_VERSION: ${{ steps.previous.outputs.highest }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "Ajoute le secret TAURI_SIGNING_PRIVATE_KEY dans le dépôt." }
          $releaseArgs = @{ AutoVersion = $true; BaseCommit = $env:BASE_COMMIT; UseNpmCli = $true }
          if ($env:PUBLISHED_VERSION) { $releaseArgs.PublishedVersion = [version]$env:PUBLISHED_VERSION }
          ./src-tauri/installer/build-release.ps1 @releaseArgs

      - name: Publier sur la release rolling
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          $remote = git ls-remote --exit-code origin refs/heads/main
          if ($LASTEXITCODE -ne 0) { throw "Impossible de vérifier la tête de main." }
          if (($remote -split '\s+')[0] -ne $env:GITHUB_SHA) {
            Write-Host 'Un push plus récent a remplacé ce build.'
            exit 0
          }
          $tag = 'rolling'
          $folder = "src-tauri/target/github-release/v$env:VERSION"
          $installer = "$folder/Black-Hole_$($env:VERSION)_x64-setup.exe"
          $manifest = "$folder/latest.json"
          $downloadUrl = (Get-Content -Raw -Encoding UTF8 -LiteralPath $manifest | ConvertFrom-Json).platforms.'windows-x86_64'.url
          $title = "Black Hole Stable v$env:VERSION"
          $notes = "[Télécharger Black Hole pour Windows x64]($downloadUrl)`n`nLes utilisateurs de Black Hole peuvent installer cette version depuis le panneau Mises à jour."
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $release = Invoke-RestMethod "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" -Headers $headers -SkipHttpErrorCheck -StatusCodeVariable status
          if ($status -eq 404) {
            gh release create $tag $installer $manifest --target $env:GITHUB_SHA --title $title --notes $notes --latest --repo $env:GITHUB_REPOSITORY
            exit $LASTEXITCODE
          }
          if ($status -ne 200) { throw "GitHub Releases a renvoyé $status." }

          gh release upload $tag $installer --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --title $title --notes $notes --latest --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload $tag $manifest --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Keep the previous installer available until its replacement is published.
          foreach ($asset in $release.assets) {
            if ($asset.name -match '^Black-Hole_(\d+\.\d+\.\d+)_x64-setup\.exe(\.sig)?$' -and
                [version]$Matches[1] -lt [version]$env:VERSION) {
              gh release delete-asset $tag $asset.name --yes --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -ne 0) { Write-Warning "Ancien fichier encore présent sur rolling : $($asset.name)" }
            }
          }
          exit 0
